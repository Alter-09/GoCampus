spring.application.name=scgo
server.port=8080

# ============================================================
# CONFIGURACIÓN DE POSTGRESQL (Entorno Principal)
# ============================================================
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/goCAMPUS}
spring.datasource.username=${DB_USERNAME:admin}
spring.datasource.password=${DB_PASSWORD:admin123}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Formato de fechas y horas
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss
spring.jackson.time-zone=America/Bogota

# Integración con IA (Módulo 3) - Sin credenciales expuestas en Git
campuslands.ai.api-key=${CAMPUSLANDS_AI_KEY:}
campuslands.ai.model=${CAMPUSLANDS_AI_MODEL:gemini-1.5-flash}
