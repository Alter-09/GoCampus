spring.application.name=scgo
server.port=8080

# ============================================================
# CONFIGURACIÓN DE POSTGRESQL (Entorno Principal)
# ============================================================
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/goCAMPUS}
spring.datasource.username=${DB_USERNAME:admin}
spring.datasource.password=${DB_PASSWORD:admin123}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Formato de fechas y horas
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss
spring.jackson.time-zone=America/Bogota

# ============================================================
# CONFIGURACIÓN DE IA (MÓDULO 3 - GROK / xAI)
# ============================================================
campuslands.ai.api-key=${CAMPUSLANDS_AI_KEY:TU_API_AQUI}
campuslands.ai.model=${CAMPUSLANDS_AI_MODEL:grok-2}
campuslands.ai.base-url=${CAMPUSLANDS_AI_BASE_URL:https://api.x.ai/v1}
